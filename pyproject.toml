[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "degenebet"
version = "0.1.0"
description = "A quantitative, data-driven NFL betting system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "nflreadpy>=0.1",
    "polars>=1.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
degenebet = "degenebet.cli:app"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
lint = [
    "ruff>=0.4",
]
typecheck = [
    "mypy>=1.10",
]
dev = [
    "degenebet[test,lint,typecheck]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/degenebet"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["degenebet"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["degenebet"]

[[tool.mypy.overrides]]
module = ["nflreadpy"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=degenebet",
    "--cov-report=term-missing",
    "-v",
]

[tool.coverage.run]
source = ["src/degenebet"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
